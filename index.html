<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSU-web-3-lab</title>
    <style>
        :root {
            --color-green: green;
            --color-white: white;
            --color-red: red;
            --color-black: black;
        }
        *,
        *::after,
        *::before{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .page{
            overflow-y: auto;
            position: relative;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }
        header{
            background-color: var(--color-green);
            color: var(--color-white);
            min-height: 40px;
            text-align: center;

            display: flex;
            align-items: center;
            justify-content: center;
        }
        li::selection, p::selection{
            background-color: var(--color-green);
            color: var(--color-white);
        }
        
        main{
            flex: 1;
            position: relative;
            height: calc(100% - 80px);
            display: flex;
            margin: auto;
            width: 630px;
            height: auto;

            & > nav{
                background-color: var(--color-red);
                color: var(--color-white);
                height: auto;
                
                width: 160px;
                min-width: 160px;

                padding: 20px 20px 0 40px;
                
                & > ul{
                    display: flex;
                    flex-direction: column;
                    gap: 10px;

                    & > li{
                        list-style-type: none;
                        text-decoration: underline;
                    }
                }
            }
            & > section{
                text-align: justify;
                padding: 30px;

                & > p::first-letter{
                    color: var(--color-red);
                    font-size: 20px;
                }
            }
        }
        footer{
            background-color: var(--color-black);
            color: var(--color-white);
            min-height: 40px;
            text-align: top;

            display: flex;
            align-items: top;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="page">
        <header>Header</header>
        <main>
            <nav>
                <ul>
                    <li>Main page</li>
                    <li>Secondary page</li>
                    <li>Some other page</li>
                    <li>More pages to the god of pages</li>
                    <li>The last page</li>
                </ul>
            </nav>
            <section>
                <p class="inner-stext"></p>
            </section>
        </main>
        <footer>Footer</footer>
    </div>
</body>
<script>
    const sText = `Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ratione eos iusto provident nihil, laboriosam esse ab minima est, in sit enim officia sunt sapiente vitae illo, dolorem! Sint debitis nesciunt ducimus ab magnam necessitatibus asperiores enim voluptate, dolores reiciendis iure. Nisi odio in consectetur inventore enim quasi ipsam velit eius eligendi quis eaque iusto suscipit quod accusamus temporibus molestiae, facere, laborum quos, rem repellat earum error expedita consequatur. Illum eos, debitis distinctio porro maiores velit quia accusantium quae voluptatem quidem minima, facilis impedit ut. Odio praesentium ea itaque voluptates numquam consectetur temporibus facilis qui magni velit laborum dicta earum beatae laudantium voluptatem sed deleniti dolores alias atque, repudiandae unde. Mollitia molestiae dolore tenetur, rem illum eveniet ratione, laboriosam repudiandae inventore expedita veniam asperiores non excepturi suscipit quod corrupti. Laborum debitis eveniet maxime vitae aliquid nulla sit fugiat voluptatem, soluta laudantium ad voluptatum in vel non sequi labore. Culpa autem, corporis, nobis cupiditate laboriosam numquam, itaque natus aperiam ut deserunt adipisci magni debitis fugit eum temporibus voluptatum ipsam rem commodi. Autem aliquam dolorem earum. Beatae reiciendis incidunt molestiae soluta earum, expedita odit tempora vel eveniet provident ab aut vero dolor assumenda, minus quia saepe nulla a id. Quia corrupti, non velit!`;
    function setTextContent(selector, text) {
        document.querySelectorAll(selector)
            .forEach(el => {
                el.textContent = text;
            })
    }

    document.addEventListener('DOMContentLoaded', () => {
        setTextContent('.inner-stext', sText);
    })
</script>

</html>
